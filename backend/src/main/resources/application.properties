spring.application.name=${APPLICATION_NAME:backend}

server.port=${SERVER_PORT:8000}

logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}

spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:policy_db}

spring.datasource.username=${DATABASE_USERNAME:root}

spring.datasource.password=${DATABASE_PASSWORD:root}

spring.jpa.show_sql=${SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}

spring.jpa.hibernate.ddl-auto=none

spring.jpa.open-in-view=false

spring.sql.init.mode=always

spring.sql.init.schema-locations=classpath:sql/policy-schema.sql

# spring.sql.init.data-locations=classpath:sql/policy-data.sql

spring.jackson.default-property-inclusion=non_null

spring.jackson.mapper.accept-case-insensitive-enums=true

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

logging.level.root=${LOGGING_LEVEL:INFO}
